<app-header (addAction)="onAddAction($event)"></app-header>

<div class="app-content">
  <h1 class="page-title">Usuarios</h1>

  @if (loading) {
    <div class="state-container">
      <p-progressSpinner strokeWidth="4" />
      <p>Cargando usuarios...</p>
    </div>
  } @else if (loadError) {
    <div class="state-container">
      <p-message
        severity="error"
        text="No se ha podido cargar el listado de usuarios. Comprueba tu conexión a internet o que la API esté disponible." />
      <p-button label="Reintentar" icon="pi pi-refresh" (onClick)="obtenerUsuarios()" />
    </div>
  } @else if (usuarios.length === 0) {
    <div class="state-container">
      <p-message severity="info" text="No hay usuarios para mostrar." />
    </div>
  } @else {
    <div class="user-grid">
      @for (usuario of usuarios; track usuario.id) {
        <p-card class="user-card">
          <div class="user-card-body">
            <p-avatar [image]="avatarSrc(usuario)" size="xlarge" shape="circle" />
            <div class="user-info">
              <h3>{{ usuario.first_name }} {{ usuario.last_name }}</h3>
              <p>{{ usuario.email }}</p>
            </div>
          </div>
          <div class="user-actions">
            <app-edit-modal [tituloModal]="'Editar usuario'" [usuario]="usuario" (editAction)="onUpdAction($event)" />
            <p-button label="Eliminar" icon="pi pi-trash" severity="danger" (onClick)="eliminarUsuario(usuario.id)" />
          </div>
        </p-card>
      }
    </div>
  }
</div>

<app-footer></app-footer>
